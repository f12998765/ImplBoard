<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实施看板 · ImplBoard</title>
<style>
  :root{
    --brand:#00b899;
    --bg:#f4f6f8;
    --text:#1f2329;
    --text-2:#5c6470;
    --text-3:#98a0ab;
    --line:#e8ebef;
    --radius:16px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  .wrap{width:100%;max-width:820px;padding:40px 28px;text-align:center}

  .hd h1{font-size:22px;margin:0 0 6px;font-weight:650;letter-spacing:.2px}
  .hd p{margin:0 0 34px;color:var(--text-3);font-size:13px}
  .hd .sub{font-size:12.5px;color:var(--brand);font-weight:500;letter-spacing:.3px;margin:-2px 0 8px}

  .apps{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}

  .app{
    width:236px;padding:26px 20px 22px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .app:hover{transform:translateY(-3px);border-color:#d8dee5;
    box-shadow:0 2px 4px rgba(16,24,40,.05),0 18px 34px -18px rgba(16,24,40,.28)}
  .app:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
  .app:active{transform:translateY(-1px)}

  .icon{
    width:76px;height:76px;border-radius:20px;margin-bottom:14px;
    box-shadow:0 6px 16px -8px rgba(16,24,40,.45);
    object-fit:cover;background:#fff;
  }
  .name{font-size:17px;font-weight:640;letter-spacing:.2px}
  .desc{font-size:12px;color:var(--text-3);line-height:1.6;margin-top:2px}
  .go{
    margin-top:16px;font-size:12.5px;color:var(--brand);font-weight:600;
    display:inline-flex;align-items:center;gap:4px;
  }
  .app:hover .go{gap:7px}
  .go i{font-style:normal;transition:transform .16s ease}

  footer{margin-top:40px;color:var(--text-3);font-size:11.5px;line-height:1.9}
  footer code{background:#eceff3;border-radius:4px;padding:1px 5px;font-size:11px}

  @media (max-width:560px){
    .app{width:100%;max-width:320px}
    .wrap{padding:28px 18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">
      <h1>实施看板</h1>
      <p class="sub">ImplBoard · 简道云 / 轻流 双平台看板</p>
      <p>选一个平台进入。两个看板都只读，不会修改任何数据。</p>
    </div>

    <div class="apps">
      <a class="app" href="{{JDY}}">
        <img class="icon" src="/icon/jdy.png" alt="简道云">
        <div class="name">简道云</div>
        <div class="desc">表单更新 · 当日新增 · 7 日趋势</div>
        <span class="go">进入 <i>›</i></span>
      </a>

      <a class="app" href="{{QF}}">
        <img class="icon" src="/icon/qf.png" alt="轻流">
        <div class="name">轻流</div>
        <div class="desc">表单发布 · 当日新增 · 7 日趋势</div>
        <span class="go">进入 <i>›</i></span>
      </a>
    </div>

    <footer>
      账号凭据存在本机 <code>~/Library/Application Support/ImplBoard/</code>，
      进入后点右上角「账号」可以更换。<br>
      两个看板都只调用查询接口，没有发布、保存、删除。
    </footer>
  </div>
</body>
</html>
